[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelley-bio"
version = "0.1.0"
description = "A powerful bioinformatics tool finder and module builder for CVMFS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BioCommons"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rich>=13.0",
    "container-guts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
]

[project.scripts]
shelley-bio = "shelley_bio.client.cli:main"
shelley-bio-batch = "shelley_bio.scripts.batch_builder:main"

[project.urls]
Homepage = "https://github.com/shelley-bio/shelley-bio"
"Bug Reports" = "https://github.com/shelley-bio/shelley-bio/issues"
Source = "https://github.com/shelley-bio/shelley-bio"

[tool.uv.sources]
container-guts = { path = "../guts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["shelley_bio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
